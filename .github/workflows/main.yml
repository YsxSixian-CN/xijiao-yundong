name: Run Sport Bots Daily

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome beautifulsoup4 pytz python-dotenv

      - name: Run xjspobot for 1 hour
        working-directory: xjspobot
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 1h python sport_bot.py
          code=$?
          if [ "$code" -eq 124 ]; then
            echo "xjspobot ran for 1 hour and was stopped as expected."
            exit 0
          fi
          exit "$code"

      - name: Run xjmimotion
        working-directory: xjmimotion
        run: python main.py
